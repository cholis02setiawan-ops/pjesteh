name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm -r --parallel build
      - name: Run all tests
        run: pnpm -r --parallel test
      - name: Generate changelog
        id: changelog
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.description }}
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate-release-notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: |
          docker build -f Dockerfile -t esteh-api:${{ github.ref_name }} .
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag esteh-api:${{ github.ref_name }} ghcr.io/${{ github.repository }}/esteh-api:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/esteh-api:${{ github.ref_name }}
