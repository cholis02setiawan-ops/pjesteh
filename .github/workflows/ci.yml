name: CI - Lint, Typecheck, Build, Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Shared setup ─────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cache pnpm modules
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

  # ─── Lint & Typecheck ────────────────────────────────
  validate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint all packages
        run: |
          pnpm -r --parallel run lint
      - name: TypeScript check
        run: |
          pnpm -r --parallel exec tsc --noEmit
      - name: Build all packages
        run: pnpm -r --parallel build

  # ─── Unit Tests ──────────────────────────────────────
  unit-test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests (money)
        run: pnpm --filter @esteh/money test
      - name: Run unit tests (api)
        run: pnpm --filter @esteh/api test

  # ─── Integration Tests ───────────────────────────────
  integration-test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm --filter @esteh/api run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

  # ─── E2E Tests ───────────────────────────────────────
  e2e-test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm --filter @esteh/api build
      - name: Build Web
        run: pnpm --filter @esteh/web build
      - name: Run E2E tests
        run: pnpm --filter @esteh/web run e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379

  # ─── Security Scanning ───────────────────────────────
  security:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run npm audit
        run: pnpm audit --audit-level=high
      - name: Run CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript, javascript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  # ─── Build & Push Docker ─────────────────────────────
  docker:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and push API image
        run: |
          docker build -f Dockerfile -t esteh-api:${{ github.sha }} .
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag esteh-api:${{ github.sha }} ghcr.io/${{ github.repository }}/esteh-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/esteh-api:${{ github.sha }}

  # ─── Deploy to Staging ───────────────────────────────
  deploy-staging:
    needs: [integration-test, docker]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging via Coolify
        run: |
          echo "Deploying to staging..."
          # Coolify API deployment trigger
          curl -X POST "${{ secrets.COOLIFY_API_URL }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"app": "esteh-api", "ref": "${{ github.sha }}"}'

  # ─── Deploy to Production ────────────────────────────
  deploy-production:
    needs: [e2e-test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Manual approval check
        run: echo "Deployment requires manual approval via GitHub Environments"
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          curl -X POST "${{ secrets.COOLIFY_API_URL }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"app": "esteh-api", "ref": "${{ github.sha }}", "environment": "production"}'

  # ─── Load Test ───────────────────────────────────────
  load-test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run k6 load test
        run: |
          docker run --rm -v $(pwd)/e2e/load:/scripts loadimpact/k6 run /scripts/load-test.js
        env:
          API_URL: http://localhost:4000
